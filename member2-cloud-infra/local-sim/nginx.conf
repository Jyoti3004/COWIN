worker_processes 1;
events { worker_connections 1024; }

http {
    upstream cowin_backend {
        # Two "Availability Zones" (containers). Passive health check:
        # after 1 failure the node is skipped for 10 s -> automatic failover.
        server zone-a:8080 max_fails=1 fail_timeout=10s;
        server zone-b:8080 max_fails=1 fail_timeout=10s;
    }

    server {
        listen 80;

        location / {
            proxy_pass http://cowin_backend;
            proxy_connect_timeout 1s;
            proxy_next_upstream error timeout http_502 http_503 http_504;
            proxy_next_upstream_tries 2;
            add_header X-LB "nginx-sim-alb" always;
        }
    }
}
